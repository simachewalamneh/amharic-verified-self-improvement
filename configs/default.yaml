# Single config for all three tasks. Override with --config my.yaml or --set key=value.
data:
  source: local            # local | synthetic | hf
  raw_dir: data/raw        # train.tsv / dev.tsv / test.tsv (MasakhaNEWS, Amharic)
  max_chars: 3000          # truncate very long articles
  seed_per_class: 20       # labelled seed set per class (Tasks 1 and 3)

features:
  backend: tfidf           # tfidf | afroxlmr (afroxlmr needs transformers + HF access)
  teacher_max_features: 10000
  student_max_features: 2000
  verifier_max_features: 50000
  afroxlmr_name: Davlan/afro-xlmr-base
  afroxlmr_max_len: 256

models:
  teacher:
    kind: mlp
    hidden: 256
    dropout: 0.5
    epochs: 30
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 32
  student:
    kind: linear
    hidden: 0
    dropout: 0.0
    epochs: 60
    lr: 0.005
    weight_decay: 0.0001
    batch_size: 32
  verifier_lr_C: 10.0      # independent char-n-gram logistic regression

task1:
  rounds: 5
  conf_threshold: 0.9
  require_agreement: true  # independent char-n-gram model must agree with the teacher
  use_rollback: true       # accept a round only if dev macro-F1 improves
  min_delta: 0.0           # required dev macro-F1 gain over the current teacher
  max_per_class_per_round: null   # optional cap to limit class drift
  stop_after_rejects: 2
  seeds: [0, 1, 2]

task2:
  temperatures: [1, 2, 4]
  alphas: [0.3, 0.5, 0.7]
  seeds: [0, 1, 2]

task3:
  temperature: null        # null -> read results/task2/best.json, fallback 2
  alpha: null              # null -> read results/task2/best.json, fallback 0.5
  seeds: [0, 1, 2]

eval:
  ece_bins: 15
  latency_samples: 200
